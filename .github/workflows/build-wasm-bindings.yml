name: Build and publish WASM bindings to NPM

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        environment: release
        steps:
            - uses: actions/checkout@v6
            - uses: dtolnay/rust-toolchain@stable
              with:
                targets: wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
              with:
                workspaces: ". -> target"
            - uses: actions/setup-node@v4
              with:
                node-version: '22.x'
                registry-url: 'https://registry.npmjs.org'
            - name: Update npm
              run: npm install -g npm@latest
            - name: Install wasm-pack
              run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            - name: Build bindings and prepare for publish (rename package)
              run: |
                wasm-pack build --release --target web peprs-wasm
                jq --arg repo "git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" '.name = "@databio/peprs" | .repository = {"type": "git", "url": $repo}' peprs-wasm/pkg/package.json > tmp.json && mv tmp.json peprs-wasm/pkg/package.json
            - name: Publish to NPM
              run: |
                npm publish --provenance --access public peprs-wasm/pkg/
            
            